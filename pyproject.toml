[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-free-coding-agent"
version = "0.5.0"
description = "A local-only, review-first coding agent powered by Ollama"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2", "langsmith>=0.3,<1",
    "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
offline-agent = "offline_agent.cli:main"

[tool.setuptools.packages.find]
include = ["offline_agent*"]

[tool.setuptools.package-data]
offline_agent = ["references/*.md"]
