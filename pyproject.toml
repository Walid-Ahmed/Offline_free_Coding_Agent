[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-free-coding-agent"
version = "0.1.0"
description = "A local-only, review-first coding agent powered by Ollama"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
offline-agent = "offline_agent.cli:main"

[tool.setuptools.packages.find]
include = ["offline_agent*"]
